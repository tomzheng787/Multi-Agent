[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-crew"
version = "0.1.0"
description = "Autonomous multi-agent marketing strategy system built on CrewAI, LangChain and Claude"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15,<2",
    "langchain-core>=1.7,<2",
    "anthropic>=2.3,<3",
    "redis>=5",
    "fakeredis>=2.26",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
marketing-crew = "marketing_crew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:function callbacks cannot be serialized:UserWarning",
]
